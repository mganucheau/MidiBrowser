<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MidiBrowser — Focused Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #131419; overflow: hidden; }
    #root { position: absolute; inset: 0; }
    button { font-family: inherit; }

    /* hover affordances */
    .mb-btn:hover { filter: brightness(1.12); }
    .mb-row:hover { background: var(--mb-elev) !important; }
    .mb-row:hover .mb-row-play { color: var(--mb-text) !important; }
    .mb-fav:hover { background: var(--mb-elev) !important; }
    .mb-fav:hover .mb-fav-x { opacity: 1 !important; }
    .mb-select:focus { border-color: var(--mb-accent-line); }

    /* scrollbars */
    .mb-root *::-webkit-scrollbar { width: 9px; height: 9px; }
    .mb-root *::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
    .mb-root *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); border: 2px solid transparent; background-clip: content-box; }
    .mb-root * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }

    /* playing equalizer bars */
    @keyframes mb-eq { 0%,100% { height: 3px; } 50% { height: 11px; } }
    .mb-eqbar { height: 6px; border-radius: 1px; animation: mb-eq .7s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { .mb-eqbar { animation: none; height: 8px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="mb/data.jsx"></script>
  <script type="text/babel" src="mb/ui.jsx"></script>
  <script type="text/babel" src="mb/browser.jsx"></script>
  <script type="text/babel" src="mb/pianoroll.jsx"></script>
  <script type="text/babel" src="mbd/knob.jsx"></script>
  <script type="text/babel" src="mbd/editor-d.jsx"></script>
  <script type="text/babel" src="mbd/app-d.jsx"></script>
</body>
</html>
